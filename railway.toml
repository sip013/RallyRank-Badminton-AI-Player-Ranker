# Railway: static Vite SPA
# Variables (build-time): VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_BASE_URL=/
#
# Install + build are owned by nixpacks.toml only.
# Do not set buildCommand to "npm ci && …" — that double-runs npm ci and causes EBUSY.

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
