# Railway: static Vite SPA
# Variables (build-time): VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_BASE_URL=/
# nixpacks.toml forces Node (avoids Deno detection from supabase/functions).

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
